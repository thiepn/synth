name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Freeze generated npm dependency graph
        if: github.event_name == 'pull_request' && github.head_ref == 'rc/phase-39' && hashFiles('package-lock.json') != ''
        shell: bash
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json already tracked."
            exit 0
          fi
          git fetch origin "$GITHUB_HEAD_REF"
          git reset --hard "origin/$GITHUB_HEAD_REF"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(rc): freeze npm dependency graph"
          git push origin HEAD:"$GITHUB_HEAD_REF"

      - name: Production build
        run: npm run build

      - name: Install Chromium for adversarial QA
        run: npm run qa:e2e:install

      - name: Production browser QA
        run: npm run qa:e2e

      - name: Release-candidate soak
        run: npm run qa:soak

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failures
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
