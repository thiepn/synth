name: Publish v1.1.0

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout certified main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify certified SHA is still main HEAD
        id: head
        shell: bash
        env:
          CERTIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main="$(gh api repos/${{ github.repository }}/commits/main --jq .sha)"
          echo "current_main=$current_main" >> "$GITHUB_OUTPUT"
          if [ "$CERTIFIED_SHA" != "$current_main" ]; then
            echo "::notice title=Release publisher idle::Certified SHA $CERTIFIED_SHA is no longer current main HEAD ($current_main)."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify production release version
        id: version
        if: steps.head.outputs.publish == 'true'
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" != "1.1.0" ]; then
            echo "::notice title=Release publisher idle::Certified main is $version, not 1.1.0."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify frozen release contract
        if: steps.head.outputs.publish == 'true' && steps.version.outputs.publish == 'true'
        run: node scripts/check-release-freeze.mjs

      - name: Publish Git tag and GitHub Release
        if: steps.head.outputs.publish == 'true' && steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --title "Synth $tag" \
              --notes-file docs/playground-v1.1/RELEASE_NOTES.md
            echo "::notice title=Release refreshed::$tag already exists; title and notes were updated from certified main."
            exit 0
          fi

          current_main="$(gh api repos/${{ github.repository }}/commits/main --jq .sha)"
          if [ "$RELEASE_SHA" != "$current_main" ]; then
            echo "::notice title=Release publisher idle::Main advanced to $current_main after certification; refusing to publish stale $RELEASE_SHA."
            exit 0
          fi

          existing_tag_sha=""
          if resolved_tag_sha="$(
            gh api "repos/${{ github.repository }}/git/ref/tags/$tag" --jq .object.sha 2>/dev/null
          )"; then
            existing_tag_sha="$resolved_tag_sha"
          fi

          if [ -n "$existing_tag_sha" ] && [ "$existing_tag_sha" != "$RELEASE_SHA" ]; then
            echo "::error title=Release tag mismatch::$tag already points to $existing_tag_sha instead of certified $RELEASE_SHA."
            exit 1
          fi

          gh release create "$tag" \
            --target "$RELEASE_SHA" \
            --title "Synth $tag" \
            --notes-file docs/playground-v1.1/RELEASE_NOTES.md
